
name: Build KING Detection v1.3 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract KING Detection
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          unzip -q KING-Detection-v1.3.zip -d extracted

          PROJECT=$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-Detection-v1.3-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
